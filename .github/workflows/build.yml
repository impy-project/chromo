name: Build

on:
  push:
    branches:
      - main
  # Runs the preflight stage only; the wheel matrix stays push-only.
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/ci/**'
  workflow_dispatch:

jobs:
  # Gate for the wheel matrix: no compilation, ~30 s. Fails on an unusable
  # Fortran toolchain or a deployment target the bundled gfortran runtime does
  # not satisfy, both of which cibuildwheel only reports an hour in.
  preflight:
    name: preflight ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup gfortran
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1.9.2
        id: setup-fortran
        with:
          compiler: gcc
          version: 13

      - name: Check Fortran toolchain
        if: runner.os != 'macOS'
        run: |
          command -v gfortran \
            || { echo "::error::Fortran compiler not on PATH"; exit 1; }
          gfortran --version | head -1

      - name: Check macOS wheel toolchain
        if: runner.os == 'macOS'
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          EXPECTED_MACOS_TARGET: '15.0'
        run: bash scripts/ci/macos_wheel_preflight.sh

  prepare-cache:
    # actions/cache archives are OS-scoped, so populate the cache on every OS
    # that downstream jobs run on.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Restore chromo data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/chromo
          key: chromo-cache-v2
      - name: Download all cache files if missing
        run: |
          mkdir -p ~/.cache/chromo
          for file in qgsjet_v002 Pythia8_v007 eposlhcr_v001 eposlhc_v001 dpm3191_v001 dpm3_v001 ; do
            if [ ! -f ~/.cache/chromo/$file.zip ]; then
              echo "Downloading $file.zip..."
              curl -L -o ~/.cache/chromo/$file.zip "https://github.com/impy-project/chromo/releases/download/zipped_data_v1.0/$file.zip"
            else
              echo "$file.zip already exists, skipping."
            fi
          done
      - name: Save chromo data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/chromo
          key: chromo-cache-v2

  wheels:
    needs: [preflight, prepare-cache]
    name: ${{ matrix.py }} ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # Slowest job is ~85 min; the GitHub default of 6 h is too coarse to
    # notice a wedged runner.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not macos-latest: Homebrew builds the gfortran runtime for
        # the runner's own OS, so the image release sets the minimum macOS of
        # the published wheels.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        arch: [auto]
        py: [cp39, cp310, cp311, cp312, cp313]
    steps:
      - name: Restore chromo data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/chromo
          key: chromo-cache-v2
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup gfortran
        # Keep >= v1.9: earlier releases hardcode the /opt/homebrew prefix and
        # leave a dangling gfortran symlink on the Intel runners.
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1.9.2
        id: setup-fortran
        with:
          compiler: gcc
          version: 13

      - name: Set macOS deployment target from the gfortran runtime
        if: runner.os == 'macOS'
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          EXPECTED_MACOS_TARGET: '15.0'
        run: bash scripts/ci/macos_wheel_preflight.sh

      - if: ${{ matrix.os != 'macos-15-intel' }}
        uses: ts-graphviz/setup-graphviz@v2
        name: Install Graphviz

      - if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm' }}
        name: cibuildwheel on Linux
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: ${{ matrix.py }}-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_PASS_LINUX: CI
          # Will avoid testing on emulated architectures
          CIBW_TEST_SKIP: "*-*linux_{ppc64le,s390x,armv7l}"

      - name: Random delay to avoid rate limits
        if: runner.os == 'macOS'
        run: |
          delay=$((RANDOM % 14 + 2))
          echo "Sleeping $delay seconds to stagger cibuildwheel downloads..."
          sleep $delay

      - if: ${{ matrix.os == 'macos-15-intel' }}
        name: cibuildwheel on macOS Intel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: ${{ matrix.py }}-*
          CIBW_ARCHS: ${{ matrix.arch }}
          no_proxy: '*'
          CHROMO_SKIP_GRAPHVIZ: 1
          CIBW_TEST_COMMAND: 'pytest -n auto -vv -k "not QgsjetIII" {project}/tests'

      - if: ${{ matrix.os == 'macos-15' }}
        name: cibuildwheel on macOS
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: ${{ matrix.py }}-*
          CIBW_ARCHS: ${{ matrix.arch }}
          no_proxy: '*'
          CIBW_TEST_COMMAND: 'pytest -n auto -vv -k "not QgsjetIII" {project}/tests'

      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheel-${{ matrix.py }}-${{ matrix.os }}-${{ matrix.arch }}

  sdist:
    needs: [preflight, prepare-cache]
    name: source package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Restore chromo data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/chromo
          key: chromo-cache-v2

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      - uses: tlylt/install-graphviz@v1
        name: Install Graphviz

      - run: python -m pip install --upgrade pip wheel setuptools
      - run: pipx run build --sdist
      - run: python -m pip install --prefer-binary -v `echo dist/chromo-*`[test]
      - run: python -m pytest -v

      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.tar.gz
          name: sdist
